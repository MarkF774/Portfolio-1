<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зерно — небольшая обжарка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;800&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#fbe4ea;--fg:#4a1026;--panel:#fff3f6;--line:#d9a9b7;--cherry:#8f1d45;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b0915;--fg:#fbe4ea;--panel:#3d1022;--line:#6e2a45;--cherry:#e0577f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b0915;--fg:#fbe4ea;--panel:#3d1022;--line:#6e2a45;--cherry:#e0577f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 Manrope,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.hero{background:var(--fg);color:var(--bg);padding:20px 0 56px}
.top{display:flex;justify-content:space-between;padding-bottom:36px;font-weight:500}
.top b{font:800 22px Bitter,Georgia,serif}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
h1{font:800 clamp(34px,6.4vw,62px)/1.05 Bitter,Georgia,serif;margin:0 0 18px}
.lead{max-width:36ch;margin:0;opacity:.85;animation:rise .8s .1s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:.85;transform:none}}
.brew{background:var(--bg);color:var(--fg);border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr 110px;gap:20px}
.brew h2{font:800 20px Bitter,Georgia,serif;margin:0 0 14px;grid-column:1/-1}
.seg{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.seg button{font:500 15px Manrope,system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1.5px solid var(--fg);background:none;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cherry);outline-offset:3px}
input[type=range]{width:100%;accent-color:var(--cherry)}
.out{font:800 46px/1 Bitter,Georgia,serif;margin:14px 0 6px}
.out small{font:500 16px Manrope,system-ui,sans-serif;margin-left:6px}
.hint{margin:0;font-size:15px;opacity:.8}
.cup{align-self:end;height:130px;border:3px solid var(--fg);border-top:0;border-radius:0 0 46px 46px;overflow:hidden;position:relative}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--cherry);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
section{padding:56px 0}
h2.s{font:800 clamp(26px,4.4vw,38px)/1.1 Bitter,Georgia,serif;margin:0 0 24px}
.bean{display:grid;grid-template-columns:20px 1.2fr 2fr auto;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;align-self:center}
.bean b{font:800 20px Bitter,Georgia,serif}
.bean span{opacity:.8}
.note{max-width:52ch;margin:28px 0 0}
footer{padding:0 0 40px;font-size:14px;opacity:.65}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bean{grid-template-columns:20px 1fr auto}.bean span{grid-column:2/-1}}
@media (prefers-reduced-motion:reduce){.lead{animation:none}.fill{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState}=React;
const html=htm.bind(React.createElement);
const METHODS={
  'Воронка':{r:16,grind:'Средний помол, как крупная соль.',time:'около 2:30'},
  'Аэропресс':{r:13,grind:'Средне-мелкий помол.',time:'около 1:30'},
  'Френч-пресс':{r:15,grind:'Крупный помол, как для дрип-пакета.',time:'4:00'}
};
const BEANS=[
  ['Эфиопия, Гуджи','#b3233f','Персик, чёрный чай, цветы. Светлая обжарка.','740 ₽'],
  ['Колумбия, Уила','#7a3a1a','Красное яблоко, карамель. Средняя обжарка.','690 ₽'],
  ['Бразилия, Сул-Миниш','#3a1a10','Орех, шоколад, низкая кислотность. Тёмная обжарка.','620 ₽']
];
function Brew(){
  const [m,setM]=useState('Воронка');
  const [w,setW]=useState(300);
  const k=METHODS[m];
  const g=(w/k.r).toFixed(1).replace('.',',');
  return html`<div class="brew">
    <h2>Сколько кофе насыпать</h2>
    <div>
      <div class="seg">${Object.keys(METHODS).map(n=>html`<button key=${n} aria-pressed=${n===m} onClick=${()=>setM(n)}>${n}</button>`)}</div>
      <label>Воды: <b>${w} мл</b>
        <input type="range" min="150" max="1000" step="10" value=${w} onInput=${e=>setW(+e.target.value)} aria-label="Количество воды в миллилитрах"/>
      </label>
      <div class="out">${g}<small>г кофе</small></div>
      <p class="hint">${k.grind} Заваривать ${k.time}. Пропорция 1 к ${k.r}.</p>
    </div>
    <div class="cup" aria-hidden="true"><div class="fill" style=${{height:(w/1000*100)+'%'}}></div></div>
  </div>`;
}
function App(){
  return html`<div>
    <header class="hero"><div class="wrap">
      <div class="top"><b>Зерно</b><span>Обжарка в Калуге</span></div>
      <div class="grid">
        <div>
          <h1>Кофе, обжаренный на этой неделе</h1>
          <p class="lead">Жарим небольшими партиями по четвергам и отправляем в пятницу. Зерно не лежит на складе месяцами.</p>
        </div>
        <${Brew}/>
      </div>
    </div></header>
    <section><div class="wrap">
      <h2 class="s">В продаже сейчас</h2>
      ${BEANS.map(([n,c,d,p])=>html`<div class="bean" key=${n}><i class="dot" style=${{background:c}}></i><b>${n}</b><span>${d}</span><b>${p}</b></div>`)}
      <p class="note">Цена за пачку 250 г. Цвет точки показывает степень обжарки: от светлой к тёмной.</p>
    </div></section>
    <footer><div class="wrap">Демо-страница для портфолио. Бренд, сорта и цены придуманы.</div></footer>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
